[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "termlv"
version = "0.1.0"
description = "Offline-first English-Latvian terminology and translation assistance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "termlv contributors"}]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
termlv = "termlv.cli:main"
termlv-mcp = "termlv.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
termlv = ["schema.sql", "sources.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

